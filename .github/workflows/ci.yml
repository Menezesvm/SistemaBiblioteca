name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: biblioteca_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Permissão do mvnw
        run: chmod +x mvnw

      - name: Build e testes
        run: ./mvnw -B verify
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/biblioteca_test
          DB_USER: root
          DB_PASSWORD: root
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

      - name: Guardar o .jar gerado
        uses: actions/upload-artifact@v7
        with:
          name: sistema-biblioteca
          path: target/*.jar

  docker:
    # CD: só roda em push na main, depois que o build passou
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/menezesvm/sistema-biblioteca:latest
            ghcr.io/menezesvm/sistema-biblioteca:${{ github.sha }}
